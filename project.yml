name: Nana
options:
  bundleIdPrefix: com.nana
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Nana:
    type: application
    platform: iOS
    sources:
      - path: NanaHarbor
      - path: pics
        type: folder
        buildPhase: resources
      - path: videos
        type: folder
        buildPhase: resources
      - path: assets/photos
        type: folder
        buildPhase: resources
      - path: assets/voice-room-slices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nanalantern.harbortide
        INFOPLIST_KEY_CFBundleDisplayName: Nana
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        SUPPORTS_MACCATALYST: false
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: NanaHarbor/Support/Nana.entitlements
    info:
      path: NanaHarbor/Support/AppInfo.plist
      properties:
        CFBundleDisplayName: Nana
        UILaunchStoryboardName: NanaLaunchScreen
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSCameraUsageDescription: "Nana uses the camera when you add a profile photo or preview yourself before a video call."
        NSPhotoLibraryUsageDescription: "Nana uses your photo library when you choose to add a profile photo."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
