workflows:
  nana-ios-app-store:
    name: Nana iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Nana

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nanalantern.harbortide

      vars:
        BUNDLE_ID: "com.nanalantern.harbortide"
        XCODE_PROJECT: "Nana.xcodeproj"
        XCODE_SCHEME: "Nana"
        APP_STORE_APPLE_ID: "6815122501"

      xcode: latest

    scripts:
      - name: Verify native iOS project configuration
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f "$XCODE_PROJECT/project.pbxproj"
          test -f "$XCODE_PROJECT/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme"
          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;" \
            "$XCODE_PROJECT/project.pbxproj"

      - name: Set up App Store signing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles

      - name: Set next App Store build number
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          LATEST_BUILD_NUMBER="$(
            app-store-connect get-latest-testflight-build-number \
              "$APP_STORE_APPLE_ID" --platform IOS --all-versions
          )"

          # A successful empty response means this app has no uploaded builds yet.
          # Authentication/network failures must stop the build instead of being hidden.
          LATEST_BUILD_NUMBER="${LATEST_BUILD_NUMBER:-0}"
          CI_BUILD_NUMBER="${BUILD_NUMBER:-1}"
          [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]] || {
            echo "Expected an integer App Store build number." >&2
            exit 1
          }
          [[ "$CI_BUILD_NUMBER" =~ ^[0-9]+$ ]]
          NEXT_BUILD_NUMBER=$((10#$LATEST_BUILD_NUMBER + 1))
          if (( 10#$CI_BUILD_NUMBER > NEXT_BUILD_NUMBER )); then
            NEXT_BUILD_NUMBER=$((10#$CI_BUILD_NUMBER))
          fi

          echo "Using build number: $NEXT_BUILD_NUMBER"
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - funchan@126.com
        notify:
          success: true
          failure: true

      app_store_connect:
        # Upload the signed IPA with the Nana integration after a successful build.
        auth: integration
        # Upload only; submission for beta/App Store review remains manual.
        submit_to_testflight: false
        submit_to_app_store: false
